{% extends "base.html" %}

{% block title %}Registrieren | SkillBridge{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/loginstyle.css') }}">
{% endblock %}

{% block body %}
<main>
    <p>SkillBridge</p>

    <h1>Konto erstellen</h1>
    <p>Registriere dich bei SkillBridge</p>

    <form method="post">
        <label for="email">E-Mail-Adresse</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="max.mustermann@email.com"
            required
        >
        <label for="password">Passwort</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
        <label for="confirm_password">Passwort bestätigen</label>
        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
        >
        <label for="role">Ich registriere mich als</label>
        <select id="role" name="role" required>
            <option value="" disabled selected>Bitte auswählen</option>
            <option value="freelancer">Freelancer</option>
            <option value="company">Unternehmen</option>
        </select>

        <button type="submit">Registrieren</button>
    </form>

    <p>Bereits ein Konto? 
        <a href="{{ url_for('login') }}">Anmelden</a></p>
</main>
{% endblock %}
