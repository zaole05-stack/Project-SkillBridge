<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> ANMELDEN | SKILLBRIDGE </title>
    
</head>

<body>
    <main>
        <p>SkillBridge</p>

        <h1>Wilkommen</h1>
        <p>Bitte melde dich mit deinem Konto an</p>

        <form>
            <label for="email">E-Mail Adresse</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="max.musterman@email.com"
                required
            >
            <label for="password">Passwort</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                >
            <button type="submit">Anmelden</button>
        </form>
    </main>
</body>
</html>
